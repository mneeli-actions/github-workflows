name: nodejs-feature-branch-workflow

on :
  # This workflow is triggered when called by another workflow using the `workflow_call` event.
  workflow_call:
    inputs:
      project:
        description: 'Project'
        required: true
        type: string
      component:
        description: 'Component'
        required: true
        type: string

env:
  PROJECT: ${{ inputs.project }}
  COMPONENT: ${{ inputs.component }}
  ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  trigger-workflow:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read version
        id: package_version
        run: |
          APP_VERSION=$(jq -r .version package.json)
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Check app version
        run: echo "$APP_VERSION"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        id: unit_tests
        run: |
          TEST=$(node -e "const p = require('./package.json'); console.log(p.scripts?.test || '')")
          if [[ -z "$TEST" || "$TEST" == *"no test specified"* ]]; then
            echo "⚠️ No tests found, skipping."
            exit 0
          fi
          npm test

      - name: Update status — Unit tests
        uses: mneeli-actions/github-workflows/.github/actions/update-commit-status@main
        with:
          token: ${{ secrets.GIT_TOKEN }}
          context: unit-tests
          state: ${{ steps.unit_tests.outcome }}
          description: library scan ${{ steps.unit_tests.outcome }}

      - name: Check dependabot alerts
        id: library_scan
        uses: Posture-Cybersecurity/dependabot-security-checker@v1.1.5
        with:
          github-token: ${{ secrets.DEPENDABOT_TOKEN }}
          severities: 'critical,high'  # Only check critical and high
          output-file: 'security-report.csv'
          fail-on-alerts: 'true'  # Fail workflow if alerts found

      - name: Update status — library-scan
        uses: mneeli-actions/github-workflows/.github/actions/update-commit-status@main
        with:
          token: ${{ secrets.GIT_TOKEN }}
          context: library-scan
          state: ${{ steps.library_scan.outcome }}
          description: library scan ${{ steps.library_scan.outcome }}

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login AWS ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        id: build_image
        run: |
          docker build -t  ${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/${PROJECT}/${COMPONENT}:${APP_VERSION} .

      - name: List images
        run: docker images

      - name: Trivy scan
        id: trivy_scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/${{ env.PROJECT }}/${{ env.COMPONENT }}:${{ env.APP_VERSION }}
          scan-type: 'image'
          vuln-type: os
          format: 'table'
          exit-code: 1
          severity: 'CRITICAL,HIGH'

      - name: Update status — Trivy scan
        uses: mneeli-actions/github-workflows/.github/actions/update-commit-status@main
        with:
          token: ${{ secrets.GIT_TOKEN }}
          context: trivy-scan
          state: ${{ steps.trivy_scan.outcome }}
          description: library scan ${{ steps.trivy_scan.outcome }}

      - name: Create ECR Repository (if not exists)
        run: |
          aws ecr describe-repositories \
            --repository-names "${{ env.PROJECT }}/${{ env.COMPONENT }}" \
            --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name "${{ env.PROJECT }}/${{ env.COMPONENT }}" \
            --region ${{ env.AWS_REGION }}

      - name: Push image
        id: push_image
        run: |
          docker push  ${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/${PROJECT}/${COMPONENT}:${APP_VERSION}

      - name: Slack alert
        if: always()
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *${{ inputs.project }}/${{ inputs.component }}* feature pipeline *${{ job.status }}*"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *${{ inputs.project }}/${{ inputs.component }}* feature pipeline: *${{ job.status }}*\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>*"
